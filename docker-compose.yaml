# Coolify docker-compose for Flora Decora local development
# This is a single-file compose that Coolify can deploy as one "project"
# Usage: place in your git repo root, then in Coolify:
#   + New -> Resource -> Docker Compose -> Point to this file

services:
  # -- Database ---------------------------------------------
  flora-db:
    image: postgres:17-alpine
    container_name: ${APP_NAME:-floradecora}-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in env}
      POSTGRES_DB: ${POSTGRES_DB:-floradecora}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coolify

  # -- Backend (NestJS) -------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${APP_NAME:-floradecora}-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@flora-db:5432/${POSTGRES_DB:-floradecora}
      DIRECT_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@flora-db:5432/${POSTGRES_DB:-floradecora}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_LOCAL_CORS: ${ALLOW_LOCAL_CORS:-true}
      ALLOW_INSECURE_COOKIE: ${ALLOW_INSECURE_COOKIE:-true}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-floradecora}
      CDN_URL: ${CDN_URL:-https://cdn.aifazi.net}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    depends_on:
      flora-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - coolify

  # -- Frontend (Next.js) -----------------------------------
  frontend:
    build:
      context: ./floradecora
      dockerfile: Dockerfile
    container_name: ${APP_NAME:-floradecora}-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      PORT: 3000
      HOSTNAME: 0.0.0.0
      BACKEND_URL: http://backend:3002
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      JWT_SECRET: ${JWT_SECRET}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      WEB3FORMS_KEY: ${WEB3FORMS_KEY:-}
      NEXT_PUBLIC_WEB3FORMS_KEY: ${NEXT_PUBLIC_WEB3FORMS_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - coolify

volumes:
  db-data:

networks:
  coolify:
    name: ${NETWORK_NAME:-coolify}
    external: true