# Render deployment config — BACKEND ONLY.
#
# Database: Supabase (managed Postgres). Set DATABASE_URL / DIRECT_URL in the
# Render dashboard for `floradecora-backend` to the Supabase connection strings.
# Do NOT add Render's `databases:` block here — the data lives in Supabase, not
# Render. This file is the source of truth for IaC; keep DB creds out of it.
#
# Frontend deploys to Vercel (see scripts/sync-vercel-env.ps1). Do NOT add a
# frontend service here — there should be no `floradecora-frontend` on Render.
# If one exists, delete it from the Render dashboard.
#
# All secrets (ADMIN_API_KEY, JWT_SECRET, R2_*, TURNSTILE_*, WEB3FORMS_KEY) are
# `sync: false` — set them manually in the Render dashboard with values
# generated via `openssl rand -base64 48`. Never commit secrets to this file.
services:
  - type: web
    name: floradecora-backend
    plan: free
    env: node
    rootDir: backend
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/main.js 2>/dev/null || node dist/src/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CORS_ORIGIN
        value: https://floradecora.com,https://www.floradecora.com
      - key: ADMIN_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: floradecora
      - key: CDN_URL
        value: https://cdn.aifazi.net
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: WEB3FORMS_KEY
        sync: false
    healthCheckPath: /api/health
