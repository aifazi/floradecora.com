services:
  - type: web
    name: floradecora-backend
    plan: free
    env: node
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: floradecora-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: floradecora-db
          property: connectionString
      - key: CORS_ORIGIN
        value: https://floradecora.com,https://www.floradecora.com
      - key: ADMIN_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: floradecora
      - key: CDN_URL
        value: https://cdn.aifazi.net
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: WEB3FORMS_KEY
        sync: false
    healthCheckPath: /api/health

  - type: web
    name: floradecora-frontend
    plan: free
    env: node
    rootDir: floradecora
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        fromService:
          name: floradecora-backend
          type: web
          property: host
      - key: JWT_SECRET
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_TURNSTILE_SITE_KEY
        sync: false
    healthCheckPath: /

databases:
  - name: floradecora-db
    # use 'free' for dev, or 'basic_256mb' / 'basic_1gb' for prod (requires payment)
    plan: free
