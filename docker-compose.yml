services:
  floradecora:
    build:
      context: ./floradecora
      dockerfile: Dockerfile
      network: host
    container_name: floradecora
    ports:
      - "3001:3000"
    env_file:
      - path: ./floradecora/.env.local
        required: false
      - path: ./floradecora/.env
        required: false
    environment:
      - NODE_ENV=production
      - WEB3FORMS_KEY=${WEB3FORMS_KEY:-}
      - NEXT_PUBLIC_WEB3FORMS_KEY=${NEXT_PUBLIC_WEB3FORMS_KEY:-}
      - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: floradecora-backend
    ports:
      - "3002:3002"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@flora-db:5432/floradecora}
      - DIRECT_URL=${DIRECT_URL:-postgresql://postgres:postgres@flora-db:5432/floradecora}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3001,http://localhost:3000}
    depends_on:
      - flora-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3002/api"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  flora-db:
    image: postgres:17-alpine
    container_name: flora-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=floradecora
    ports:
      - "5433:5432"
    volumes:
      - flora-db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  flora-db-data:
