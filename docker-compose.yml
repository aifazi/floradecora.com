services:
  floradecora:
    build:
      context: ./floradecora
      dockerfile: Dockerfile
      network: host
    container_name: floradecora
    ports:
      - "3001:3000"
    env_file:
      - path: ./floradecora/.env.local
        required: false
      - path: ./floradecora/.env
        required: false
    environment:
      - NODE_ENV=production
      - WEB3FORMS_KEY=${WEB3FORMS_KEY:-}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      - BACKEND_URL=http://backend:3002
      - JWT_SECRET=${JWT_SECRET:-}
      - NEXT_PUBLIC_API_URL=
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: floradecora-backend
    ports:
      - "127.0.0.1:3002:3002"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:?set DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL:-${DATABASE_URL:?set DIRECT_URL}}
      # CORS_ORIGIN — prod override: https://floradecora.com,https://www.floradecora.com
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3001,http://localhost:3000}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET}
      # COOKIE_SECURE must be true in prod (https); false for local http only
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - R2_ENDPOINT=${R2_ENDPOINT:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET=${R2_BUCKET:-floradecora}
      - CDN_URL=${CDN_URL:-https://cdn.aifazi.net}
    depends_on:
      flora-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  flora-db:
    image: postgres:17-alpine
    container_name: flora-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=floradecora
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - flora-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  flora-db-data:
