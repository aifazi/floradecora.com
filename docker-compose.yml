services:
  floradecora:
    build:
      context: ./floradecora
      dockerfile: Dockerfile
      network: host
    container_name: floradecora
    ports:
      - "3001:3000"
    env_file:
      - path: ./floradecora/.env.local
        required: false
      - path: ./floradecora/.env
        required: false
    environment:
      - NODE_ENV=production
      - WEB3FORMS_KEY=${WEB3FORMS_KEY:-}
      - NEXT_PUBLIC_WEB3FORMS_KEY=${NEXT_PUBLIC_WEB3FORMS_KEY:-}
      - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
